<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSE CYS 1 (1-64) — PDF Upload Portal</title>
    <style>
        :root { --bg: #191C24; --surface: #2A2D35; --primary: #00D084; --text: #E0E0E0; --border: #3A3D45; }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); color: var(--text); padding: 20px; max-width: 800px; margin: 0 auto; }
        .card { background: var(--surface); padding: 25px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
        h1, h2 { margin-top: 0; }
        select, input, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
        button { background: var(--primary); color: #000; font-weight: bold; cursor: pointer; border: none; transition: opacity 0.2s; }
        button:hover { opacity: 0.8; }
        button:disabled { background: #555; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--primary); }
    </style>
</head>
<body>

<div class="card">
    <h1>CYS 1 Assignment Submission</h1>
    <p>Submit your PDFs directly to the cohort's Drive folder.</p>

    <select id="rollNo">
        <option value="" disabled selected>Select Roll Number...</option>
    </select>

    <input type="text" id="studentName" placeholder="First Name (e.g., Santanu)" required>
    <input type="file" id="fileInput" accept="application/pdf" required>
    <button id="uploadBtn" onclick="uploadFile()">Upload PDF</button>
    <p id="status"></p>
</div>

<div class="card">
    <h2>Submission Log</h2>
    <button onclick="loadSubmissions()" style="width: auto; padding: 8px 16px; margin-bottom: 10px; font-size: 14px;">Refresh Log</button>
    <table>
        <thead>
        <tr>
            <th>Filename</th>
            <th>Date & Time</th>
        </tr>
        </thead>
        <tbody id="logTableBody">
        <tr><td colspan="2">Loading submissions...</td></tr>
        </tbody>
    </table>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxH3kF9oHRR6MweGa_j_34ZpjtcHkM5Jg0u3Driyp0-TKa8zUPn3V0bL6I7EHeVmlZiLg/exec";

    // Populate Roll 1-64
    const rollSelect = document.getElementById("rollNo");
    for (let i = 1; i <= 64; i++) {
        let opt = document.createElement("option");
        opt.value = i;
        opt.textContent = `Roll ${i}`;
        rollSelect.appendChild(opt);
    }

    async function uploadFile() {
        const roll = document.getElementById("rollNo").value;
        const name = document.getElementById("studentName").value.trim();
        const fileInput = document.getElementById("fileInput").files[0];
        const status = document.getElementById("status");
        const btn = document.getElementById("uploadBtn");

        if (!roll || !name || !fileInput) {
            status.textContent = "Please fill all fields and select a PDF.";
            status.style.color = "#ff6b6b";
            return;
        }

        btn.disabled = true;
        status.textContent = "Uploading... please wait.";
        status.style.color = "var(--text)";

        const reader = new FileReader();
        reader.onload = async function(e) {
            const base64 = e.target.result.split(',')[1];
            const newFilename = `Roll${roll}_${name}_Document.pdf`;

            try {
                const response = await fetch(WEB_APP_URL, {
                    method: "POST",
                    body: JSON.stringify({ base64: base64, filename: newFilename })
                });
                const result = await response.json();
                if (result.status === "success") {
                    status.textContent = "Upload successful!";
                    status.style.color = "var(--primary)";
                    document.getElementById("fileInput").value = "";
                    loadSubmissions(); // Refresh the log
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                status.textContent = "Upload failed. Try again.";
                status.style.color = "#ff6b6b";
            }
            btn.disabled = false;
        };
        reader.readAsDataURL(fileInput);
    }

    async function loadSubmissions() {
        const tbody = document.getElementById("logTableBody");
        try {
            const response = await fetch(WEB_APP_URL);
            const result = await response.json();

            if (result.status === "success") {
                tbody.innerHTML = "";
                if (result.files.length === 0) {
                    tbody.innerHTML = "<tr><td colspan='2'>No submissions yet.</td></tr>";
                    return;
                }
                result.files.forEach(file => {
                    const date = new Date(file.timestamp);
                    const row = `<tr>
                            <td>${file.name}</td>
                            <td>${date.toLocaleDateString()} ${date.toLocaleTimeString()}</td>
                        </tr>`;
                    tbody.innerHTML += row;
                });
            }
        } catch (error) {
            tbody.innerHTML = "<tr><td colspan='2'>Failed to load log.</td></tr>";
        }
    }

    // Load log on start
    window.onload = loadSubmissions;
</script>
</body>
</html>
